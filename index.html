<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libestria.fr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nostr:       #9277EB;
      --simplex:     #2EC9DF;
      --bg:          #000000;
      --surface:     #0a0a0a;
      --border:      rgba(255,255,255,0.07);
      --text:        #e8e6f0;
      --muted:       #6a6880;
      --logo-height: 36px; /* hauteur commune des logos Nostr et SimpleX */
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Exo 2', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    main {
      width: 100%;
      max-width: 820px;
      padding: 72px 24px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 44px;
    }

    /* Logo principal */
    .logo-wrap { animation: fadeUp 0.7s ease both; }
    .logo-wrap img { width: min(520px, 88vw); height: auto; display: block; }

    /* Badge "Relais privés à venir" */
    .soon-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 20px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      animation: fadeUp 0.7s 0.1s ease both;
    }
    .soon-badge::before {
      content: '';
      width: 9px; height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--nostr), var(--simplex));
      box-shadow: 0 0 8px rgba(146,119,235,0.9), 0 0 20px rgba(146,119,235,0.6), 0 0 40px rgba(46,201,223,0.4);
      animation: flashDot 1.2s ease-in-out infinite;
    }

    /* Logos Nostr et SimpleX */
    .services {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      animation: fadeUp 0.7s 0.2s ease both;
    }
    .service-logo {
      display: flex;
      align-items: center;
      opacity: 0.75;
      transition: opacity 0.2s, transform 0.2s;
    }
    .service-logo:hover { opacity: 1; transform: translateY(-2px); }
    .service-logo img { height: var(--logo-height); width: auto; display: block; }
    .service-sep { width: 1px; height: 28px; background: var(--border); }

    /* Séparateur */
    .divider { width: 40px; height: 1px; background: var(--border); }

    /* Carte NIP-05 */
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.7s 0.3s ease both;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--nostr), var(--simplex), transparent);
      opacity: 0.45;
    }
    .card-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .card-title {
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
      letter-spacing: 0.04em;
    }
    .nip05 {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      background: rgba(146,119,235,0.08);
      border: 1px solid rgba(146,119,235,0.22);
      border-radius: 8px;
      padding: 12px 24px;
      color: var(--nostr);
      letter-spacing: 0.04em;
    }

    /* Contact */
    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: fadeUp 0.7s 0.4s ease both;
    }
    .contact-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .contact a {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.88rem;
      color: var(--simplex);
      text-decoration: none;
      border-bottom: 1px solid rgba(46,201,223,0.28);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .contact a:hover { color: #fff; border-color: #fff; }

    /* Bouton Zap */
    .zap-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeUp 0.7s 0.5s ease both;
    }
    .btn-zap {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 38px;
      border-radius: 12px;
      font-family: 'Exo 2', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #6a4fc8, #9277EB, #b39af0);
      border: 1px solid rgba(146,119,235,0.5);
      box-shadow: 0 0 18px rgba(146,119,235,0.45), 0 0 40px rgba(146,119,235,0.2), inset 0 1px 0 rgba(255,255,255,0.15);
      overflow: hidden;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .btn-zap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.18) 60%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }
    .btn-zap:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 28px rgba(146,119,235,0.65), 0 0 60px rgba(146,119,235,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .btn-zap:hover::before { transform: translateX(200%); }
    .btn-zap:active { transform: translateY(0) scale(0.99); }

    .zap-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* Footer */
    footer {
      padding: 0 0 32px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      animation: fadeUp 0.7s 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes flashDot {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(146,119,235,0.9), 0 0 20px rgba(146,119,235,0.6), 0 0 40px rgba(46,201,223,0.4); transform: scale(1); }
      50%       { opacity: 0.15; box-shadow: none; transform: scale(0.6); }
    }

    @media (max-width: 560px) {
      main { padding: 48px 16px 36px; gap: 32px; }
      .card { padding: 28px 18px; }
      .btn-zap { padding: 13px 28px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <main>

    <div class="logo-wrap">
      <img src="36107281-5595-4484-B4DC-BD929AB12451.png" alt="Libestria">
    </div>

    <span class="soon-badge">Relais privés à venir</span>

    <!-- Logos — remplace les deux src par tes URLs GitHub -->
    <div class="services">
      <a class="service-logo" href="https://nostr.com" target="_blank" rel="noopener" title="Nostr">
        <img src="IMG_7155.png" alt="Nostr">
      </a>
      <div class="service-sep"></div>
      <a class="service-logo" href="https://simplex.chat" target="_blank" rel="noopener" title="SimpleX Chat">
        <img src="IMG_7165.png" alt="SimpleX Chat">
      </a>
    </div>

    <div class="divider"></div>

    <div class="card">
      <span class="card-label">• Identité Décentralisée •</span>
      <p class="card-title">Obtiens ton identifiant NIP-05 vérifié</p>
      <div class="nip05">ton-pseudo@id.libestria.fr</div>
      <p class="card-title">en envoyant une demande par mail</p>
    </div>

    <div class="contact">
      <span class="contact-label">• Contact •</span>
      <a href="mailto:artefact@libestria.fr">artefact@libestria.fr</a>
    </div>

    <div class="zap-wrap">
      <a class="btn-zap" href="lightning:brownrabbit19@primal.net" target="_blank">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 2L4.5 13.5H11L10 22L20.5 10H14L13 2Z"/>
        </svg>
        Zap
      </a>
      <span class="zap-sub">brownrabbit19@primal.net</span>
    </div>

  </main>

  <footer>© Libestria.fr</footer>
</body>
</html>
