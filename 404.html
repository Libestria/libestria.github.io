<!DOCTYPE html>

<style>
:root {
  color-scheme: dark;
  --grad-title: linear-gradient(105deg,#d9a4ff 0%,#b45cff 25%,#f26adf 52%,#8e7bff 75%,#39c8ff 100%);
  --grad-frame: linear-gradient(135deg,#b45cff 0%,#f26adf 33%,#8e7bff 62%,#39c8ff 100%);
  --sans: "Exo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono: "Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
}
*,*::before,*::after { box-sizing: border-box; }
html { min-height: 100%; background: #000; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; min-height: 100dvh; margin: 0; display: flex; flex-direction: column; background: #000; color: #e3dfeb; font-family: var(--sans); }
main { flex: 1; display: flex; flex-direction: column; gap: clamp(16px,3vh,28px); width: 90%; max-width: 1200px; margin: 0 auto; padding: clamp(22px,5vh,48px) 0; }
.banner { display: flex; align-items: center; gap: clamp(9px,1.8vw,22px); }
.brand-logo { display: block; width: clamp(68px,10vw,115px); height: auto; filter: drop-shadow(0 0 18px rgb(139 63 217 / 16%)); }
.wordmark { margin: 0; font: 400 clamp(1.6rem,4.3vw,4.1rem)/1.12 var(--mono); white-space: nowrap; background: var(--grad-title); background-clip: text; -webkit-background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 5px rgb(180 92 255 / 32%)) drop-shadow(0 0 15px rgb(242 106 223 / 17%)); }
.content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; padding: clamp(18px,4vw,45px) 12px; text-align: center; }
.error-code { margin: 0; font: 400 clamp(4.5rem,27vw,26rem)/.9 var(--mono); letter-spacing: -.045em; background: var(--grad-title); background-clip: text; -webkit-background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 14px rgb(180 92 255 / 18%)); }
.content h1 { margin: 0; color: #fff; font: 400 clamp(1.4rem,3vw,2rem)/1.3 var(--mono); }
.content p { max-width: 550px; margin: 0; font-size: clamp(1rem,2vw,1.15rem); line-height: 1.7; }
.btn { display: inline-flex; justify-content: center; align-items: center; min-height: 44px; margin-top: 8px; padding: 10px 20px; border: 1px solid #665185; border-radius: 13px; background: #1b1924; color: #e9e5f4; font: 500 1rem/1.4 var(--sans); text-decoration: none; transition: background .2s,border-color .2s,color .2s; }
.btn:focus-visible { outline: 2px solid #9b6bf2; outline-offset: 4px; }
@media (hover:hover) { .btn:hover { background: #2b2040; border-color: #8b63d8; color: #fff; } }
footer { width: 90%; max-width: 1200px; margin: 0 auto; padding: 8px 0 16px; color: #fff; font: 400 clamp(.65rem,1.9vw,.8rem) var(--mono); text-align: center; }
@media (max-width: 480px) { main { width: 94%; } .banner { justify-content: center; } .content { gap: 17px; } }
@media (prefers-reduced-motion:reduce) { .btn { transition: none; } }

<main>
<header class="banner">
<img class="brand-logo" src="/IMG/IMG_Libestria.png" alt="" decoding="async">

<p>Cette page n’existe pas, ou son adresse a changé. Tu peux revenir à l’accueil pour poursuivre ta visite.</p>

</main>
<footer>© 2026 Libestria.fr | Propulsé par ΛRTΞFΛCT</footer>
