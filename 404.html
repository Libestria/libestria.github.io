:root {
  color-scheme: dark;
  --text: #f2f0f7;
  --text-2: #bdb9cf;
  --muted: #9693aa;
  --icon: #8e87a5;

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { min-height: 100%; background: #000; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
  background: #000; color: var(--text); font-family: var(--sans);
}
main {
  flex: 1 0 auto; display: flex; flex-direction: column;
  width: 90%; max-width: 1600px; margin: 0 auto;
  padding: clamp(10px, 2vh, 24px) 0; gap: clamp(10px, 1.6vh, 20px);

}
.wordmark, .error-code {
  color: transparent; background: var(--grad-title);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.content {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  align-items: center; gap: 20px; padding: clamp(18px, 4vw, 45px) 12px;
  text-align: center;
}
.error-code { font: 400 clamp(4.5rem, 27vw, 26rem) / .9 var(--mono); letter-spacing: -.045em; }
.content h1 { color: #fff; font: 400 clamp(1.4rem, 3vw, 2rem) / 1.3 var(--mono); text-wrap: balance; }

.btn {

  border: 1px solid var(--btn-border); border-radius: var(--r-lg);
  background: var(--btn-bg); color: var(--icon);
  font-size: 1rem; letter-spacing: normal; line-height: 1.4; text-decoration: none; white-space: nowrap;
  transition: background .2s, border-color .2s, color .2s;
}
a[href]:hover { cursor: pointer; }
a { -webkit-tap-highlight-color: transparent; }
.btn:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 3px;
  background: var(--btn-hover-bg); border-color: var(--btn-hover-border); color: #fff;
}
@media (hover: hover) {
  .btn:hover { background: var(--btn-hover-bg); border-color: var(--btn-hover-border); color: #fff; }

@media (max-width: 340px) { .wordmark { white-space: normal; overflow-wrap: anywhere; } }
@media (max-height: 620px) { main { gap: 6px; padding: 5px 0; } }
