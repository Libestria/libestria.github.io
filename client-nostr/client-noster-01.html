<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nostr</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0e0f10;
  --surface:  #161718;
  --surface2: #1c1d1f;
  --border:   #252729;
  --text:     #e2e2e0;
  --sub:      #6b6f74;
  --blue:     #4d9de0;
  --green:    #3dbb7e;
  --badge:    #3d6fa8;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

/* ── APP SHELL ── */
.app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
  max-width: 780px;
  margin: 0 auto;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

/* ── TOP BAR ── */
.topbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 50;
}

.profile-chip {
  display: flex;
  align-items: center;
  gap: 9px;
}

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--surface2);
  overflow: hidden;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--sub);
  border: 1px solid var(--border);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.profile-info {}
.profile-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.2;
}
.profile-addr {
  font-size: 11px;
  color: var(--sub);
  font-family: 'IBM Plex Mono', monospace;
}

/* Search */
.search-wrap {
  position: relative;
}
.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.35;
  pointer-events: none;
}
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 7px 10px 7px 32px;
  outline: none;
  transition: border-color 0.15s;
}
.search-input::placeholder { color: var(--sub); }
.search-input:focus { border-color: #3a3d42; }

/* Relay status */
.relay-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--sub);
  font-family: 'IBM Plex Mono', monospace;
  white-space: nowrap;
}
.rled {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--sub);
  transition: all 0.3s;
}
.rled.on  { background: var(--green); box-shadow: 0 0 5px var(--green); }
.rled.err { background: #e05c5c; }
.rled.wait { background: #e0a84d; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── TABS ── */
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--sub);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px;
  padding: 11px 8px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  position: relative;
  text-align: center;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  color: var(--text);
  border-bottom-color: var(--blue);
}
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--badge);
  color: #fff;
  font-size: 10px;
  font-weight: 500;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  padding: 0 4px;
  margin-left: 5px;
  vertical-align: middle;
}

/* ── CONTENT ── */
.content {
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
}

/* Live bar */
.livebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--sub);
}
.live-dot {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 5px;
  box-shadow: 0 0 4px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.btn-refresh {
  background: none;
  border: 1px solid var(--border);
  color: var(--sub);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-refresh:hover { color: var(--text); border-color: #3a3d42; }

/* ── FEED ── */
.feed {
  overflow-y: auto;
  overscroll-behavior: contain;
}
.feed::-webkit-scrollbar { width: 3px; }
.feed::-webkit-scrollbar-thumb { background: var(--border); }

/* Note */
.note {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 11px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  animation: slideIn 0.2s ease;
  transition: background 0.1s;
  cursor: default;
}
.note:hover { background: rgba(255,255,255,.012); }
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.note-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 500;
  color: var(--sub);
  flex-shrink: 0;
  margin-top: 1px;
}
.note-avatar img { width: 100%; height: 100%; object-fit: cover; }

.note-right {}

.note-header {
  display: flex;
  align-items: baseline;
  gap: 7px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.note-author {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}
.note-handle {
  font-size: 11px;
  color: var(--sub);
  font-family: 'IBM Plex Mono', monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 140px;
}
.note-ts {
  font-size: 11px;
  color: var(--sub);
  margin-left: auto;
  white-space: nowrap;
  font-family: 'IBM Plex Mono', monospace;
}

.note-text {
  font-size: 13.5px;
  color: #cccbc7;
  line-height: 1.6;
  word-break: break-word;
  white-space: pre-wrap;
}
.note-text a { color: var(--blue); text-decoration: none; }
.note-text a:hover { text-decoration: underline; }

.note-footer {
  display: flex;
  gap: 18px;
  margin-top: 9px;
}
.nf-btn {
  background: none;
  border: none;
  color: var(--sub);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0;
  transition: color 0.12s;
  line-height: 1;
}
.nf-btn:hover { color: var(--text); }
.nf-btn.active-like { color: #e05c8a; }
.nf-btn.active-zap  { color: #e0a84d; }
.nf-btn.active-rt   { color: var(--green); }

/* ── COMPOSE PANEL ── */
.compose-panel {
  position: fixed;
  bottom: 20px;
  right: calc(50% - 390px + 16px);
  z-index: 60;
}
@media(max-width:780px){
  .compose-panel { right: 16px; }
}

.fab {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--blue);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(77,157,224,.35);
  transition: all 0.15s;
  color: #fff;
}
.fab:hover { transform: scale(1.07); box-shadow: 0 6px 24px rgba(77,157,224,.45); }

.compose-box {
  display: none;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  width: 360px;
  box-shadow: 0 12px 40px rgba(0,0,0,.6);
  margin-bottom: 10px;
  animation: popUp 0.18s ease;
}
@keyframes popUp {
  from { opacity:0; transform:translateY(8px) scale(.97); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}
.compose-box.open { display: flex; }

.compose-textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13.5px;
  line-height: 1.6;
  padding: 10px 12px;
  resize: none;
  height: 90px;
  outline: none;
  transition: border-color 0.15s;
}
.compose-textarea:focus { border-color: #3a3d42; }
.compose-textarea::placeholder { color: var(--sub); }

.compose-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.compose-count {
  font-size: 11px;
  color: var(--sub);
  font-family: 'IBM Plex Mono', monospace;
}
.compose-count.warn { color: #e0a84d; }
.compose-count.over { color: #e05c5c; }

.btn-send {
  background: var(--blue);
  color: #fff;
  border: none;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.12s;
}
.btn-send:hover { background: #5aabe8; }
.btn-send:disabled { background: var(--border); color: var(--sub); cursor: not-allowed; }

/* ── EMPTY / LOADER ── */
.feed-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 60px 20px;
  color: var(--sub);
  font-size: 13px;
}
.loader {
  width: 18px; height: 18px;
  border: 1.5px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(6px);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 16px;
  font-size: 12px;
  color: var(--text);
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s;
  z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok   { border-color: var(--green); color: var(--green); }
.toast.err  { border-color: #e05c5c;     color: #e05c5c; }

@media(max-width:600px){
  .topbar { grid-template-columns: auto 1fr auto; gap: 8px; }
  .profile-info { display: none; }
  .note-handle { max-width: 80px; }
}
</style>
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="profile-chip">
      <div class="avatar" id="myAvatar">—</div>
      <div class="profile-info">
        <div class="profile-name" id="myName">—</div>
        <div class="profile-addr" id="myAddr">nostr</div>
      </div>
    </div>

    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" id="searchInput" placeholder="Nom, npub ou NIP-05" oninput="filterNotes()">
    </div>

    <div class="relay-status">
      <div class="rled wait" id="rled"></div>
      <span id="relayCount">0/4 relais</span>
    </div>
  </header>

  <!-- TABS -->
  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('home',this)">Accueil</button>
    <button class="tab-btn" onclick="switchTab('notifs',this)">Notifications<span class="badge" id="notifBadge">0</span></button>
    <button class="tab-btn" onclick="switchTab('zaps',this)">Zaps</button>
    <button class="tab-btn" onclick="switchTab('messages',this)">Messages</button>
  </nav>

  <!-- CONTENT -->
  <div class="content">
    <div class="livebar">
      <span><span class="live-dot"></span>Flux en direct &middot; <span id="contactCount">0</span> contacts</span>
      <button class="btn-refresh" onclick="refreshFeed()">↺ Rafraîchir</button>
    </div>

    <div class="feed" id="feed">
      <div class="feed-placeholder" id="placeholder">
        <div class="loader"></div>
        <span>Connexion aux relais…</span>
      </div>
    </div>
  </div>

</div>

<!-- COMPOSE -->
<div class="compose-panel">
  <div class="compose-box" id="composeBox">
    <textarea class="compose-textarea" id="composeText"
      placeholder="Qu'est-ce qui se passe ?" maxlength="500"
      oninput="updateCount()"></textarea>
    <div class="compose-row">
      <span class="compose-count" id="composeCount">0 / 280</span>
      <button class="btn-send" id="btnSend" onclick="publishNote()">Publier</button>
    </div>
  </div>
  <button class="fab" onclick="toggleCompose()" title="Nouvelle note">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const RELAYS = [
  "wss://relay.damus.io",
  "wss://nos.lol",
  "wss://relay.nostr.band",
  "wss://nostr.mom",
];
const LIMIT = 40;

// ── STATE ─────────────────────────────────────────────────────────────────────
let sockets    = {};         // url → { ws, ok }
let connCount  = 0;
let notes      = [];         // rendered note data
let seenIds    = new Set();
let profiles   = {};         // pubkey → { name, picture, nip05 }
let myPubkey   = null;
let composeOpen = false;
let notifCount = 0;
let totalContacts = 0;
let activeTab  = 'home';
let filterQ    = '';
let liked = new Set(), reposted = new Set(), zapped = new Set();

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  await loadIdentity();
  connectAll();
}

async function loadIdentity() {
  if (!window.nostr) {
    document.getElementById('myName').textContent = 'Pas d\'extension';
    document.getElementById('btnSend').disabled = true;
    return;
  }
  try {
    myPubkey = await window.nostr.getPublicKey();
    const short = myPubkey.slice(0,8) + '…' + myPubkey.slice(-6);
    document.getElementById('myAddr').textContent = short;
    document.getElementById('myName').textContent = 'Connecté';
    document.getElementById('myAvatar').textContent = '●';
    // Fetch own profile
    scheduleProfileFetch(myPubkey, true);
  } catch(e) {
    document.getElementById('myName').textContent = 'Refusé';
    document.getElementById('btnSend').disabled = true;
  }
}

// ── RELAYS ────────────────────────────────────────────────────────────────────
function connectAll() {
  RELAYS.forEach(url => connectRelay(url));
}

function connectRelay(url) {
  try {
    const ws = new WebSocket(url);
    sockets[url] = { ws, ok: false };

    ws.onopen = () => {
      sockets[url].ok = true;
      connCount = Object.values(sockets).filter(s=>s.ok).length;
      setRelayUI();
      subscribe(ws);
    };

    ws.onmessage = e => {
      try { handleEvent(JSON.parse(e.data)); } catch(_) {}
    };

    ws.onerror = ws.onclose = () => {
      sockets[url].ok = false;
      connCount = Object.values(sockets).filter(s=>s.ok).length;
      setRelayUI();
      setTimeout(() => connectRelay(url), 6000);
    };
  } catch(_) {}
}

function subscribe(ws) {
  // Global text notes
  ws.send(JSON.stringify(["REQ","feed",{ kinds:[1], limit:LIMIT }]));
}

function setRelayUI() {
  const led = document.getElementById('rled');
  const txt = document.getElementById('relayCount');
  txt.textContent = connCount + '/' + RELAYS.length + ' relais';
  led.className = 'rled ' + (connCount > 0 ? 'on' : 'err');
  // remove placeholder once at least one connected
  if (connCount > 0) {
    const ph = document.getElementById('placeholder');
    if (ph && document.querySelectorAll('.note').length === 0) {
      ph.innerHTML = '<span style="color:var(--sub);font-size:12px">En attente de notes…</span>';
    }
  }
}

// ── EVENT HANDLING ────────────────────────────────────────────────────────────
function handleEvent([type, , event]) {
  if (type !== 'EVENT' || !event) return;

  if (event.kind === 1) ingestNote(event);
  if (event.kind === 0) ingestProfile(event);
}

function ingestNote(ev) {
  if (seenIds.has(ev.id)) return;
  seenIds.add(ev.id);

  notes.unshift(ev);
  if (notes.length > 200) notes.pop();

  totalContacts = Math.max(totalContacts, seenIds.size);
  document.getElementById('contactCount').textContent = seenIds.size;

  removePlaceholder();
  prependNote(ev);

  if (!profiles[ev.pubkey]) scheduleProfileFetch(ev.pubkey);
}

function ingestProfile(ev) {
  try {
    const m = JSON.parse(ev.content);
    profiles[ev.pubkey] = m;
    updateProfileUI(ev.pubkey, m);

    if (ev.pubkey === myPubkey) {
      document.getElementById('myName').textContent = m.name || 'Moi';
      document.getElementById('myAddr').textContent = m.nip05 || ev.pubkey.slice(0,10)+'…';
      const av = document.getElementById('myAvatar');
      if (m.picture) av.innerHTML = `<img src="${esc(m.picture)}" onerror="this.remove()">`;
      else av.textContent = (m.name||'?').slice(0,2).toUpperCase();
    }
  } catch(_) {}
}

const profileQueue = new Set();
let profileTimer = null;
function scheduleProfileFetch(pk, immediate=false) {
  if (profiles[pk] !== undefined) return;
  profiles[pk] = null; // mark pending
  profileQueue.add(pk);
  if (immediate) { flushProfileQueue(); return; }
  clearTimeout(profileTimer);
  profileTimer = setTimeout(flushProfileQueue, 400);
}

function flushProfileQueue() {
  if (!profileQueue.size) return;
  const pks = [...profileQueue].slice(0, 20);
  pks.forEach(pk => profileQueue.delete(pk));
  const relay = Object.values(sockets).find(s => s.ok && s.ws.readyState===1);
  if (!relay) return;
  relay.ws.send(JSON.stringify(["REQ","profiles-"+Date.now(), { kinds:[0], authors:pks, limit:20 }]));
}

// ── RENDER NOTE ───────────────────────────────────────────────────────────────
function prependNote(ev) {
  if (activeTab !== 'home') return;
  if (filterQ && !ev.content.toLowerCase().includes(filterQ)) return;

  const feed = document.getElementById('feed');
  const profile = profiles[ev.pubkey] || {};
  const name = profile ? (profile.name || shortKey(ev.pubkey)) : shortKey(ev.pubkey);
  const pic  = profile ? profile.picture : null;

  const el = document.createElement('div');
  el.className = 'note';
  el.dataset.id = ev.id;
  el.dataset.pk = ev.pubkey;
  el.dataset.txt = ev.content.toLowerCase();
  el.dataset.ts = ev.created_at;

  el.innerHTML = `
    <div class="note-avatar" id="nav-${ev.id}">
      ${pic ? `<img src="${esc(pic)}" onerror="this.remove()">` : initials(name)}
    </div>
    <div class="note-right">
      <div class="note-header">
        <span class="note-author" id="nan-${ev.pubkey.slice(0,12)}">${esc(name)}</span>
        <span class="note-handle" id="nah-${ev.pubkey.slice(0,12)}">${shortKey(ev.pubkey)}</span>
        <span class="note-ts">${relTime(ev.created_at)}</span>
      </div>
      <div class="note-text">${linkify(esc(ev.content))}</div>
      <div class="note-footer">
        <button class="nf-btn" id="like-${ev.id}" onclick="toggleLike('${ev.id}',this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span id="lc-${ev.id}">0</span>
        </button>
        <button class="nf-btn" id="rt-${ev.id}" onclick="toggleRT('${ev.id}',this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span id="rc-${ev.id}">0</span>
        </button>
        <button class="nf-btn" id="zap-${ev.id}" onclick="toggleZap('${ev.id}',this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span id="zc-${ev.id}">0</span>
        </button>
        <button class="nf-btn" onclick="copyNote('${ev.id}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
    </div>
  `;

  const first = feed.querySelector('.note');
  first ? feed.insertBefore(el, first) : feed.appendChild(el);

  // Trim DOM
  const all = feed.querySelectorAll('.note');
  if (all.length > 100) all[all.length-1].remove();
}

function updateProfileUI(pk, m) {
  document.querySelectorAll(`[data-pk="${pk}"]`).forEach(el => {
    const nameEl = el.querySelector(`[id^="nan-"]`);
    const handleEl = el.querySelector(`[id^="nah-"]`);
    const avEl = el.querySelector('.note-avatar');
    if (nameEl && m.name) nameEl.textContent = m.name;
    if (handleEl && m.nip05) handleEl.textContent = m.nip05;
    if (avEl && m.picture) {
      avEl.innerHTML = `<img src="${esc(m.picture)}" onerror="this.remove()">`;
    }
  });
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function toggleLike(id, btn) {
  if (liked.has(id)) { liked.delete(id); btn.classList.remove('active-like'); document.getElementById('lc-'+id).textContent='0'; }
  else { liked.add(id); btn.classList.add('active-like'); document.getElementById('lc-'+id).textContent='1'; }
}
function toggleRT(id, btn) {
  if (reposted.has(id)) { reposted.delete(id); btn.classList.remove('active-rt'); document.getElementById('rc-'+id).textContent='0'; }
  else { reposted.add(id); btn.classList.add('active-rt'); document.getElementById('rc-'+id).textContent='1'; toast('Reposté ✓','ok'); }
}
function toggleZap(id, btn) {
  if (zapped.has(id)) { zapped.delete(id); btn.classList.remove('active-zap'); document.getElementById('zc-'+id).textContent='0'; }
  else { zapped.add(id); btn.classList.add('active-zap'); document.getElementById('zc-'+id).textContent='1'; toast('⚡ Zap !','ok'); }
}
function copyNote(id) {
  navigator.clipboard.writeText('nostr:' + id);
  toast('ID copié','ok');
}

// ── COMPOSE ───────────────────────────────────────────────────────────────────
function toggleCompose() {
  composeOpen = !composeOpen;
  document.getElementById('composeBox').classList.toggle('open', composeOpen);
  if (composeOpen) document.getElementById('composeText').focus();
}

function updateCount() {
  const len = document.getElementById('composeText').value.length;
  const el = document.getElementById('composeCount');
  el.textContent = len + ' / 280';
  el.className = 'compose-count' + (len>260?' warn':'') + (len>=280?' over':'');
}

async function publishNote() {
  if (!window.nostr || !myPubkey) { toast('Extension Alby / nos2x requise','err'); return; }
  const content = document.getElementById('composeText').value.trim();
  if (!content) return;

  const ev = { kind:1, created_at:Math.floor(Date.now()/1000), tags:[], content, pubkey:myPubkey };

  try {
    const signed = await window.nostr.signEvent(ev);
    let sent = 0;
    Object.values(sockets).forEach(({ws, ok}) => {
      if (ok && ws.readyState===1) { ws.send(JSON.stringify(["EVENT",signed])); sent++; }
    });
    if (sent) {
      document.getElementById('composeText').value = '';
      updateCount();
      toggleCompose();
      toast('Publié sur ' + sent + ' relai(s) ✓','ok');
      ingestNote(signed);
    } else {
      toast('Aucun relai connecté','err');
    }
  } catch(e) { toast('Signature refusée','err'); }
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const feed = document.getElementById('feed');
  if (tab === 'home') {
    rerenderFeed();
  } else {
    feed.innerHTML = `<div class="feed-placeholder"><span style="color:var(--sub);font-size:13px">${tab === 'notifs' ? '0 notification' : tab === 'zaps' ? 'Aucun zap reçu' : 'Aucun message'}</span></div>`;
  }
}

function rerenderFeed() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  const sorted = [...notes].sort((a,b) => b.created_at - a.created_at);
  sorted.slice(0,80).forEach(ev => prependNote(ev));
  if (!sorted.length) feed.innerHTML = '<div class="feed-placeholder"><span style="color:var(--sub);font-size:12px">Aucune note</span></div>';
}

function refreshFeed() {
  rerenderFeed();
  toast('Feed actualisé','ok');
  // Re-subscribe
  Object.values(sockets).forEach(({ws, ok}) => {
    if (ok && ws.readyState===1) subscribe(ws);
  });
}

// ── FILTER ────────────────────────────────────────────────────────────────────
function filterNotes() {
  filterQ = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.note').forEach(el => {
    el.style.display = (!filterQ || el.dataset.txt.includes(filterQ)) ? '' : 'none';
  });
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function removePlaceholder() {
  const ph = document.getElementById('placeholder');
  if (ph) ph.remove();
}

function shortKey(pk) { return pk ? pk.slice(0,6)+'…'+pk.slice(-4) : ''; }
function initials(n)   { return (n||'?').slice(0,2).toUpperCase(); }
function esc(s)        {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function linkify(s)    {
  return s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function relTime(ts) {
  const d = Math.floor(Date.now()/1000) - ts;
  if (d<60)    return d+'s';
  if (d<3600)  return Math.floor(d/60)+'min';
  if (d<86400) return Math.floor(d/3600)+'h';
  return Math.floor(d/86400)+'j';
}

function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className='toast', 2500);
}

// Refresh timestamps
setInterval(() => {
  document.querySelectorAll('.note-ts').forEach((el, i) => {
    if (notes[i]) el.textContent = relTime(notes[i].created_at);
  });
}, 30000);

// Close compose on outside click
document.addEventListener('click', e => {
  if (composeOpen && !e.target.closest('.compose-panel')) {
    composeOpen = false;
    document.getElementById('composeBox').classList.remove('open');
  }
});

init();
</script>
