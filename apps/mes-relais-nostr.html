<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes relais Nostr</title>
<style>
/* ---------- Thème ---------- */
:root {
  --bg: #f6f5fb; --card: #fff; --ink: #1b1930; --mute: #6b6886; --line: #e3e0f0;
  --acc: #5b3df5; --accink: #fff;
  --ok: #1a9d5c; --okink: #fff; --bad: #d03a4a; --warn: #c98a10;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12101f; --card: #1b1830; --ink: #eeecfa; --mute: #9a96b8; --line: #2d2948;
    --acc: #8f7bff; --accink: #12101f;
    --ok: #41d08a; --okink: #0b1f14; --bad: #ff6b7a; --warn: #f0b43c;
  }
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 1.7rem; margin: 0 0 4px; letter-spacing: -.02em; }
h2 { font-size: 1rem; margin: 0 0 10px; }
.sub { margin: 0 0 20px; color: var(--mute); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.top { margin-top: 12px; }
.msg { font-size: .9rem; color: var(--mute); margin: 8px 0 0; }
.msg.inline { margin: 0; }
.hint { margin: 0 0 12px; color: var(--mute); font-size: .9rem; }
.empty { color: var(--mute); padding: 8px 0; margin: 0; }
#who { font-size: .85rem; color: var(--mute); word-break: break-all; }

/* ---------- Champs et boutons ---------- */
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 8px 14px; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
button.main { background: var(--acc); color: var(--accink); border-color: var(--acc); font-weight: 600; }
input { font: inherit; width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }

/* ---------- Onglets ---------- */
.tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; }
.tabs button { white-space: nowrap; border-radius: 99px; color: var(--mute); }
.tabs button.on { background: var(--acc); color: var(--accink); border-color: var(--acc); font-weight: 600; }

/* ---------- Ligne de relais ---------- */
.relay { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.relay:first-child { border-top: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mute); flex: none; }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--bad); }
.url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: .9rem ui-monospace, Menlo, monospace; }
.lat { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--mute); flex: none; white-space: nowrap; }
.lat svg { width: 16px; height: 12px; }
.lat.g svg { color: var(--ok); }
.lat.o svg { color: var(--warn); }
.lat.r svg { color: var(--bad); }
.del { color: var(--bad); font-size: .8rem; padding: 5px 10px; }
.modes { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 0 100%; padding-left: 20px; }
.modes button { font-size: .8rem; padding: 5px 10px; color: var(--mute); }
.modes button.on { background: var(--ok); color: var(--okink); border-color: var(--ok); font-weight: 600; }

/* ---------- Suggestions ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips .lbl { flex: 1 0 100%; font-size: .82rem; font-weight: 600; margin-top: 6px; }
.chips .lbl:first-child { margin-top: 0; }
.chips button { font-size: .82rem; padding: 4px 10px; border-radius: 99px; color: var(--mute); }

/* ---------- Publication ---------- */
.bar { position: sticky; bottom: 0; padding: 12px 16px; background: linear-gradient(transparent, var(--bg) 40%); display: flex; justify-content: center; }
.bar button { width: 100%; max-width: 608px; padding: 12px; }
.res { font: .85rem ui-monospace, Menlo, monospace; margin: 4px 0; }
.res.ok::before { content: "✓ "; color: var(--ok); }
.res.bad::before { content: "✕ "; color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Mes relais Nostr</h1>
  <p class="sub">Gérez vos relais publics, de messages privés et de recherche, puis publiez chaque liste.</p>

  <div class="card" id="login">
    <button class="main" id="btnLogin">Se connecter avec mon extension</button>
    <p class="msg" id="loginMsg">Nécessite une extension compatible NIP-07 (Alby, nos2x, Flamingo…). Votre clé privée ne quitte jamais l’extension.</p>
  </div>

  <div id="app" hidden>
    <p id="who"></p>
    <div class="tabs" id="tabs" role="tablist"></div>

    <div class="card">
      <h2 id="listTitle"></h2>
      <p class="hint" id="listHint"></p>
      <div id="list"></div>
      <div class="row top">
        <button id="btnTest">Tester la connexion</button>
        <span class="msg inline" id="listMsg"></span>
      </div>
    </div>

    <div class="card">
      <h2>Ajouter un relais</h2>
      <div class="row">
        <input id="newUrl" placeholder="relay.example.com" autocapitalize="off" autocomplete="off" spellcheck="false">
        <button id="btnAdd">Ajouter</button>
      </div>
      <div class="chips" id="chips"></div>
      <p class="msg" id="addMsg"></p>
    </div>

    <div class="card" id="resCard" hidden>
      <h2>Résultat de la publication</h2>
      <div id="results"></div>
    </div>

    <div class="bar"><button class="main" id="btnPub">Publier cette liste</button></div>
  </div>
</main>

<script>
/* ---------- Configuration ---------- */
const BOOT_RELAYS = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://purplepag.es", "wss://relay.nostr.band"];
const TIMEOUT = { connect: 5000, fetch: 4000, publish: 6000 };
const LATENCY = { fast: 500, slow: 1200 }; // ms : vert < fast, orange < slow, rouge au-delà

// L'ordre des clés = l'ordre des onglets.
const LISTS = {
  pub: {
    kind: 10002, rw: true, tag: "r",
    tab: "Lecture (R) & Écriture (W)", title: "Relais publics (NIP-65)",
    hint: "Les relais où vous publiez (écriture) et où les autres vous répondent (lecture).",
    suggestions: ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://relay.nostr.band", "wss://purplepag.es", "wss://nostr.wine"],
    french: ["wss://relay.nostrmap.net", "wss://relay.decentralia.fr", "wss://relay.noeudlibre.fr"],
  },
  search: {
    kind: 10007, rw: false, tag: "relay",
    tab: "Recherche (S)", title: "Relais de recherche (NIP-51)",
    hint: "Les relais interrogés quand vous cherchez des profils ou des notes.",
    suggestions: ["wss://relay.nostr.band", "wss://search.nos.today", "wss://relay.noswhere.com", "wss://nostr.wine"],
  },
  dm: {
    kind: 10050, rw: false, tag: "relay",
    tab: "Messages Privés (DM)", title: "Relais de messages privés (NIP-17)",
    hint: "Les relais où l’on vous envoie vos messages privés. Choisissez-en 1 à 3 fiables, idéalement avec authentification.",
    suggestions: ["wss://auth.nostr1.com", "wss://nip17.com", "wss://inbox.nostr.wine", "wss://relay.damus.io"],
  },
};
for (const list of Object.values(LISTS)) { list.relays = []; list.dirty = false; }

/* ---------- État ---------- */
let pubkey = null;
let current = "pub";
const latencies = {}; // url -> { ms } | { err }

const $ = id => document.getElementById(id);
const currentList = () => LISTS[current];

/* ---------- Réseau ---------- */
function normalizeUrl(input) {
  let u = (input || "").trim().replace(/^https:\/\//i, "wss://").replace(/^http:\/\//i, "ws://");
  if (!/^wss?:\/\//i.test(u)) u = "wss://" + u;
  try {
    const x = new URL(u);
    if (!x.hostname.includes(".") && x.hostname !== "localhost") return null;
    return x.protocol + "//" + x.host + x.pathname.replace(/\/$/, "");
  } catch { return null; }
}

function openSocket(url, timeout = TIMEOUT.connect) {
  return new Promise((resolve, reject) => {
    let ws;
    const timer = setTimeout(() => { try { ws.close(); } catch {} reject(new Error("délai dépassé")); }, timeout);
    try { ws = new WebSocket(url); } catch (e) { clearTimeout(timer); return reject(e); }
    ws.onopen = () => { clearTimeout(timer); resolve(ws); };
    ws.onerror = () => { clearTimeout(timer); reject(new Error("connexion impossible")); };
  });
}

function parseMessage(raw) {
  try { return JSON.parse(raw); } catch { return []; }
}

async function fetchEvents(url) {
  try {
    const ws = await openSocket(url, TIMEOUT.fetch);
    return await new Promise(resolve => {
      const events = [];
      const done = () => { clearTimeout(timer); ws.close(); resolve(events); };
      const timer = setTimeout(done, TIMEOUT.fetch);
      ws.onmessage = ({ data }) => {
        const [type, , event] = parseMessage(data);
        if (type === "EVENT" && event) events.push(event);
        if (type === "EOSE" || type === "CLOSED") done();
      };
      const kinds = Object.values(LISTS).map(l => l.kind);
      ws.send(JSON.stringify(["REQ", "lists", { kinds, authors: [pubkey] }]));
    });
  } catch { return []; }
}

async function publishTo(url, event) {
  try {
    const ws = await openSocket(url);
    return await new Promise(resolve => {
      const timer = setTimeout(() => { ws.close(); resolve({ url, ok: false, msg: "pas de réponse" }); }, TIMEOUT.publish);
      ws.onmessage = ({ data }) => {
        const [type, id, ok, msg] = parseMessage(data);
        if (type === "OK" && id === event.id) { clearTimeout(timer); ws.close(); resolve({ url, ok, msg: msg || "" }); }
      };
      ws.send(JSON.stringify(["EVENT", event]));
    });
  } catch (e) { return { url, ok: false, msg: e.message }; }
}

async function ping(url) {
  const start = performance.now();
  try {
    const ws = await openSocket(url);
    const ms = Math.round(performance.now() - start);
    ws.close();
    return { ms };
  } catch (e) { return { err: e.message }; }
}

/* ---------- Conversion liste <-> événement ---------- */
function relaysFromEvent(event, list) {
  const relays = [];
  for (const [name, rawUrl, marker] of event.tags || []) {
    const url = normalizeUrl(rawUrl);
    if (name !== list.tag || !url || relays.some(r => r.url === url)) continue;
    relays.push({ url, read: marker !== "write", write: marker !== "read" });
  }
  return relays;
}

function tagsFromList(list) {
  return list.relays.map(r => {
    if (!list.rw) return ["relay", r.url];
    if (r.read && r.write) return ["r", r.url];
    return ["r", r.url, r.read ? "read" : "write"];
  });
}

/* ---------- Affichage ---------- */
function latencyView(status) {
  if (!status) return { cls: "", bars: 0, text: "…" };
  if (status.err) return { cls: "r", bars: 0, text: "hors ligne" };
  const bars = status.ms < LATENCY.fast ? 3 : status.ms < LATENCY.slow ? 2 : 1;
  return { cls: ["", "r", "o", "g"][bars], bars, text: status.ms + " ms" };
}

function signalSvg(lit) {
  const bars = [[0, 8, 4], [6, 4, 8], [12, 0, 12]]
    .map(([x, y, h], i) => `<rect x="${x}" y="${y}" width="4" height="${h}" rx="1" fill="currentColor"${i < lit ? "" : ' opacity=".25"'}/>`)
    .join("");
  return `<svg viewBox="0 0 16 12" aria-hidden="true">${bars}</svg>`;
}

function relayRow(list, relay, index) {
  const status = latencies[relay.url];
  const lat = latencyView(status);
  const mode = relay.read && relay.write ? "rw" : relay.read ? "r" : "w";

  const row = document.createElement("div");
  row.className = "relay";
  row.innerHTML =
    `<span class="dot ${status ? (status.err ? "bad" : "ok") : ""}"></span>` +
    `<div class="url"></div>` +
    `<span class="lat ${lat.cls}" title="Temps de réponse">${signalSvg(lat.bars)}${lat.text}</span>` +
    `<button class="del">Supprimer</button>` +
    (list.rw
      ? `<div class="modes">
           <button data-mode="r">Lecture seule (R)</button>
           <button data-mode="w">Écriture seule (W)</button>
           <button data-mode="rw">Lecture + Écriture (R+W)</button>
         </div>`
      : "");

  row.querySelector(".url").textContent = relay.url;
  row.querySelector(".del").onclick = () => { list.relays.splice(index, 1); list.dirty = true; render(); };
  row.querySelectorAll("[data-mode]").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.mode === mode);
    btn.onclick = () => {
      relay.read = btn.dataset.mode.includes("r");
      relay.write = btn.dataset.mode.includes("w");
      list.dirty = true;
      render();
    };
  });
  return row;
}

function renderTabs() {
  const tabs = $("tabs");
  tabs.innerHTML = "";
  for (const [key, list] of Object.entries(LISTS)) {
    const btn = document.createElement("button");
    btn.textContent = `${list.tab} (${list.relays.length})`;
    btn.className = key === current ? "on" : "";
    btn.setAttribute("role", "tab");
    btn.onclick = () => {
      current = key;
      $("addMsg").textContent = "";
      $("resCard").hidden = true;
      render();
      testAll();
    };
    tabs.appendChild(btn);
  }
}

function renderSuggestions(list) {
  const chips = $("chips");
  chips.innerHTML = "";
  for (const [label, urls] of [["Suggestions", list.suggestions], ["Francophones", list.french]]) {
    const available = (urls || []).filter(u => !list.relays.some(r => r.url === u));
    if (!available.length) continue;
    const title = document.createElement("div");
    title.className = "lbl";
    title.textContent = label;
    chips.appendChild(title);
    for (const url of available) {
      const btn = document.createElement("button");
      btn.textContent = "+ " + url;
      btn.onclick = () => addRelay(url);
      chips.appendChild(btn);
    }
  }
}

function render() {
  const list = currentList();
  renderTabs();
  $("listTitle").textContent = list.title;
  $("listHint").textContent = list.hint;

  const container = $("list");
  container.innerHTML = list.relays.length ? "" : '<p class="empty">Aucun relais pour l’instant. Ajoutez-en un ci-dessous.</p>';
  list.relays.forEach((relay, i) => container.appendChild(relayRow(list, relay, i)));
  renderSuggestions(list);
}

/* ---------- Actions ---------- */
function addRelay(input) {
  const list = currentList();
  const url = normalizeUrl(input);
  const msg = $("addMsg");
  if (!url) { msg.textContent = "Adresse invalide. Exemple : relay.damus.io"; return; }
  if (list.relays.some(r => r.url === url)) { msg.textContent = "Ce relais est déjà dans cette liste."; return; }
  list.relays.push({ url, read: true, write: true });
  list.dirty = true;
  msg.textContent = "";
  $("newUrl").value = "";
  render();
  testRelay(url);
}

async function testRelay(url) {
  latencies[url] = await ping(url);
  render();
}

async function testAll() {
  $("listMsg").textContent = "Test en cours…";
  await Promise.all(currentList().relays.map(r => testRelay(r.url)));
  $("listMsg").textContent = "";
}

async function login() {
  const msg = $("loginMsg");
  if (!window.nostr) { msg.textContent = "Aucune extension NIP-07 détectée. Installez Alby ou nos2x, puis rechargez la page."; return; }
  try { pubkey = await window.nostr.getPublicKey(); }
  catch { msg.textContent = "Connexion refusée par l’extension."; return; }

  $("login").hidden = true;
  $("app").hidden = false;
  $("who").textContent = `Clé publique : ${pubkey.slice(0, 12)}…${pubkey.slice(-8)}`;
  $("listMsg").textContent = "Chargement de vos listes…";

  const events = (await Promise.all(BOOT_RELAYS.map(fetchEvents))).flat();
  for (const list of Object.values(LISTS)) {
    const latest = events.filter(e => e.kind === list.kind).sort((a, b) => b.created_at - a.created_at)[0];
    list.relays = latest ? relaysFromEvent(latest, list) : [];
  }
  $("listMsg").textContent = "";
  render();
  testAll();
}

async function publish() {
  const list = currentList();
  if (!list.relays.length) { $("listMsg").textContent = "Ajoutez au moins un relais avant de publier."; return; }

  const button = $("btnPub");
  const resetButton = () => { button.disabled = false; button.textContent = "Publier cette liste"; };
  button.disabled = true;
  button.textContent = "Signature…";

  let event;
  try {
    event = await window.nostr.signEvent({ kind: list.kind, created_at: Math.floor(Date.now() / 1000), tags: tagsFromList(list), content: "" });
  } catch {
    resetButton();
    $("listMsg").textContent = "Signature refusée.";
    return;
  }

  button.textContent = "Publication…";
  const writeRelays = relays => relays.filter(r => r.write).map(r => r.url);
  const targets = [...new Set([
    ...(list.rw ? writeRelays(list.relays) : []),
    ...writeRelays(LISTS.pub.relays),
    ...BOOT_RELAYS,
  ])];
  const results = await Promise.all(targets.map(url => publishTo(url, event)));
  showResults(results);
  list.dirty = false;
  resetButton();
}

function showResults(results) {
  const box = $("results");
  box.innerHTML = "";
  const accepted = results.filter(r => r.ok).length;

  const summary = document.createElement("p");
  summary.className = "msg";
  summary.textContent = accepted
    ? `Liste publiée sur ${accepted} relais sur ${results.length}.`
    : "Aucun relais n’a accepté la liste. Vérifiez vos relais d’écriture.";
  box.appendChild(summary);

  for (const r of results) {
    const line = document.createElement("div");
    line.className = "res " + (r.ok ? "ok" : "bad");
    line.textContent = r.url + (r.ok ? "" : " — " + (r.msg || "refusé"));
    box.appendChild(line);
  }
  $("resCard").hidden = false;
  $("resCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ---------- Événements ---------- */
$("btnLogin").onclick = login;
$("btnAdd").onclick = () => addRelay($("newUrl").value);
$("newUrl").onkeydown = e => { if (e.key === "Enter") addRelay(e.target.value); };
$("btnTest").onclick = testAll;
$("btnPub").onclick = publish;
window.addEventListener("beforeunload", e => {
  if (Object.values(LISTS).some(l => l.dirty)) e.preventDefault();
});
</script>
</body>
</html>
